<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Ground soft shadow -->
  <ellipse cx="50" cy="88" rx="28" ry="6" fill="#3C2415" fill-opacity="0.18" />

  <!-- Feet -->
  <ellipse cx="38" cy="85" rx="9" ry="4.5" fill="#F27420" stroke="#3C2415" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <ellipse cx="62" cy="85" rx="9" ry="4.5" fill="#F27420" stroke="#3C2415" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chubby Pear Body -->
  <path d="M 50 18 C 66 18, 77 28, 76 42 C 75 54, 84 62, 84 74 C 84 84, 66 85, 50 85 C 34 85, 16 84, 16 74 C 16 62, 25 54, 24 42 C 23 28, 34 18, 50 18 Z" fill="#FDE872" stroke="#3C2415" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Soft Belly Gradient / Shadow -->
  <ellipse cx="50" cy="78" rx="24" ry="5.5" fill="#F59E0B" fill-opacity="0.22" />

  <!-- Left Wing -->
  <ellipse cx="22" cy="56" rx="6.5" ry="12" fill="#FDE872" stroke="#3C2415" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-10 22 56)" />

  <!-- Right Wing -->
  <ellipse cx="78" cy="56" rx="6.5" ry="12" fill="#FDE872" stroke="#3C2415" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(10 78 56)" />

  <!-- Beak (Plump Horizontal Orange Oval) -->
  <ellipse cx="50" cy="46" rx="10" ry="6" fill="#F27420" stroke="#3C2415" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Eyes (Beady Dark Brown Dots) -->
  <circle cx="37" cy="40" r="3" fill="#3C2415" />
  <circle cx="63" cy="40" r="3" fill="#3C2415" />

  <!-- Rosy Pink Cheek Blush -->
  <ellipse cx="28" cy="48" rx="4.5" ry="3.5" fill="#F43F5E" fill-opacity="0.4" />
  <ellipse cx="72" cy="48" rx="4.5" ry="3.5" fill="#F43F5E" fill-opacity="0.4" />
</svg>
